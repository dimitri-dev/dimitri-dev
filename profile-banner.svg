    </pattern>
  </defs>
  <rect width="960" height="320" rx="16" fill="url(#background)"/>
  <rect width="960" height="320" rx="16" fill="url(#grid)"/>
  <rect x="1" y="1" width="958" height="318" rx="15" stroke="#303943"/>
