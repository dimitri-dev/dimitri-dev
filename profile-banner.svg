  <text x="40" y="188" fill="#F0B45A" font-family="Consolas, monospace" font-size="28">SOFTWARE ENGINEER</text>
  <path d="M40 228H920" stroke="#35404B"/>
  <text x="40" y="269" fill="#B7C1CC" font-family="Consolas, monospace" font-size="20">.NET / C# / PostgreSQL / Astro</text>
  <g transform="translate(850 120)" stroke="#F0B45A" stroke-opacity="0.55" stroke-width="2">
